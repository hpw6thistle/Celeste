name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html || { echo 'Missing index.html at repository root.' >&2; exit 1; }
          mkdir -p dist
          cp index.html dist/index.html
          test -s demo-images.js || { echo 'Missing demo-images.js.' >&2; exit 1; }
          cp demo-images.js dist/demo-images.js
          test -s img/model.jpg || { echo 'Missing default model image.' >&2; exit 1; }
          if [[ -d img ]]; then
            cp -R img dist/img
          fi
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
