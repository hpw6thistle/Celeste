<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Céleste · Virtual Try-On</title>
<style>
:root{font-family:"Noto Sans TC",Arial,sans-serif;color:#282427;background:#eee8ec}*{box-sizing:border-box}body{margin:0;overflow:hidden}button,input{font:inherit}button{cursor:pointer}#app{width:1920px;height:1080px;position:absolute;transform-origin:top left;background:linear-gradient(117deg,#fff9f6 0%,#f8f4fb 52%,#fff9f3 100%);display:grid;grid-template-columns:515px 790px 550px;gap:18px;padding:25px;overflow:hidden}#app:before,#app:after{content:"";pointer-events:none;position:absolute;z-index:0;width:700px;height:700px;border-radius:50%;filter:blur(90px);opacity:.42;background:radial-gradient(circle,#a6c9ff 0%,#efcde8 50%,transparent 70%);animation:breathe 5s ease-in-out infinite alternate}#app:before{left:380px;top:-210px}#app:after{right:-180px;bottom:-250px;animation-delay:2s;background:radial-gradient(circle,#f3d4b2,#c4cbfa 50%,transparent 70%)}@keyframes breathe{0%{opacity:.12;transform:scale(.83)}100%{opacity:.55;transform:scale(1.17)}}.panel{position:relative;z-index:1}.left{padding:8px 12px}.logo{font:italic 74px Georgia,serif;letter-spacing:-3px}.sub{font:28px Georgia,serif;margin-top:-12px}.search{width:100%;border:1px solid #d8ccd1;background:#fffbfd;border-radius:13px;padding:13px 17px;margin:22px 0 10px;font-size:20px}.tabs{display:flex;gap:9px;border-bottom:1px solid #cfc6cb;padding:10px 0}.tabs button{border:0;background:none;font-size:19px;padding:9px 16px}.tabs .active{border-bottom:3px solid #40353b}.section h3{font:26px Georgia,serif;margin:13px 0 10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.product{height:184px;background:#fffafc;border:2px solid transparent;border-radius:11px;padding:7px;text-align:left;position:relative;overflow:hidden}.product.selected{border-color:#393039}.product .mini{height:113px;display:grid;place-items:center}.product svg{width:110px;height:108px}.product .name{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.product small{font-size:14px}.tag{position:absolute;top:0;right:0;background:#352c32;color:#fff;padding:3px 7px;font-size:12px}.stage{background:rgba(255,255,255,.80);border:1px solid #fff;border-radius:18px;overflow:hidden;position:relative;box-shadow:0 10px 35px #5b4b6112}.stage h2{font:29px Georgia,serif;margin:21px 28px;position:relative;z-index:3}.glow{position:absolute;width:600px;height:750px;top:110px;left:120px;border-radius:50%;background:radial-gradient(ellipse,#fff 22%,#e5ecff88 65%,transparent 72%);animation:breathe 6s alternate infinite}.hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:16px;color:#817581}.model{position:absolute;left:170px;top:87px;width:465px;height:896px}.model svg{width:100%;height:100%}.look-layer{position:absolute;inset:0;clip-path:inset(0 0 100% 0);pointer-events:none}.beam{position:absolute;height:4px;width:465px;left:170px;background:#fff;box-shadow:0 0 12px 5px #fff;display:none}.thumbs{position:absolute;left:24px;top:120px;z-index:4;display:grid;gap:13px}.thumb{border:1px solid #dfd5d9;border-radius:10px;background:#fff;padding:4px;width:95px;height:116px;display:grid;place-items:center}.thumb svg{max-width:83px;max-height:100px}.source{position:absolute;right:20px;top:75px;z-index:5;width:95px;padding:7px;background:#fff;border-radius:10px;box-shadow:0 2px 12px #7773;text-align:center;font-size:12px}.source img{width:100%;border-radius:7px}.right{padding:6px 18px}.right h2{font:44px Georgia,serif;margin:0 0 15px}.row{display:flex;gap:10px;padding:14px 0;border-bottom:1px solid #e5dce0;align-items:center;font-size:18px}.row .icon svg{width:60px;height:70px}.row b{margin-left:auto;font-size:18px}.total{display:flex;justify-content:space-between;margin:23px 0 34px;font-size:25px}.total strong{font:35px Georgia,serif}.right h3{font:30px Georgia,serif;border-bottom:1px solid #e0d8de;padding-bottom:12px;margin:22px 0}.score{display:flex;align-items:center;gap:12px;margin:20px 0;font-size:18px}.bar{flex:1;height:11px;border-radius:9px;background:#e0d7dc;overflow:hidden}.bar i{display:block;height:100%;background:#3b3239}.shop{width:100%;background:#3d333a;color:#fff;font:26px Georgia,serif;border:0;border-radius:10px;padding:20px}.complete{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.complete button{border:1px solid #d9cdd3;border-radius:10px;background:#fffafc;padding:5px}.complete svg{width:100%;height:143px}.upload{margin-top:15px;padding:10px;border:1px solid #e3d7dd;border-radius:12px;background:#ffffffaa;font-size:15px}.upload label{display:inline-block;padding:8px 13px;border:1px solid #998b94;border-radius:7px;cursor:pointer;margin:4px}.upload input{display:none}.notice{position:absolute;bottom:48px;left:50%;transform:translateX(-50%);z-index:10;background:#382e35;color:#fff;padding:14px 22px;border-radius:24px;display:none}.cursor{display:none;position:absolute;z-index:15;font-size:30px;pointer-events:none}.ripple{display:none;position:absolute;width:42px;height:42px;border:3px solid #40343a;border-radius:50%;z-index:14;pointer-events:none}.demo *{animation:none!important;transition:none!important}
</style></head><body><div id="app">
<aside class="panel left"><div class="logo">Céleste</div><div class="sub">Virtual Try-On Room</div><input id="search" class="search" placeholder="⌕ 搜尋商品"><div class="tabs"><button class="active" data-tab="all">全部</button><button data-tab="tops">上衣</button><button data-tab="dresses">洋裝</button><button data-tab="bags">配件</button></div><div id="catalog"></div><div class="upload"><b>更換素材</b><div><label>更換模特兒<input id="modelUpload" type="file" accept="image/*"></label><label>上傳整套試穿照<input id="lookUpload" type="file" accept="image/*"></label></div><small>上傳僅在目前分頁預覽；不會傳送到伺服器。合成試穿圖需外部 AI 產圖後匯入。</small></div></aside>
<main class="panel stage"><h2 id="trying">Trying on · 格紋洋裝</h2><div class="glow"></div><div class="model" id="current"></div><div class="model look-layer" id="next"></div><div class="beam" id="beam"></div><div class="thumbs" id="thumbs"></div><div class="source"><img id="portrait" src="img/model.jpg" alt="模特兒來源照片"><div>模特兒參考圖</div></div><div class="hint">服裝圖像為互動版型示意，非 AI 精準換裝照片</div><div class="notice" id="notice"></div></main>
<aside class="panel right"><h2>Your Look</h2><div id="looklist"></div><div class="total"><span>總價</span><strong id="total"></strong></div><h3>Style &amp; Fit</h3><div id="scores"></div><button id="shop" class="shop">Shop the look →</button><h3>Complete looks · 一鍵換整套</h3><div class="complete" id="complete"></div></aside><div class="cursor" id="cursor">➤</div><div class="ripple" id="ripple"></div>
</div><script>
const products={tops:[['T01','絨感亨利領毛衣',1690,'#6b463a'],['T02','復古緹花針織衫',1890,'#675745'],['T03','雲霧輕柔針織衫',1790,'#ddd3df']],dresses:[['D01','格紋荷葉娃娃領洋裝',2390,'#a6796c'],['D02','奶油蕾絲洋裝',2590,'#e8dbc9'],['D03','深棕吊帶洋裝',2290,'#493d38']],bags:[['B01','復古皮革肩背包',2390,'#754c3e'],['B02','奶茶色托特包',2190,'#c8aa8c'],['B03','莓果色手提包',2090,'#784257']]};
let state={t:0,d:0,b:-1},tab='all',uploadLook=null,trans=null;const $=id=>document.getElementById(id),money=x=>'NT$ '+x.toLocaleString(),demo=new URLSearchParams(location.search).has('demo');
function garment(type,id,color){let pattern=type==='dresses'&&id===0?'stroke="#644e4a" stroke-width="1.3" stroke-dasharray="4 5"':'',base=type==='tops'?'<path d="M28 27 Q50 10 72 27 L85 39 97 90 77 98 70 65 68 103 32 103 30 65 23 98 3 90 16 39Z"/>':type==='dresses'?'<path d="M28 12 Q50 22 72 12 L85 29 78 50 91 108 9 108 22 50 15 29Z"/>':'<path d="M28 44 Q31 21 48 23 L63 23 Q76 26 77 44 L86 88 Q83 100 70 95 L30 95 Q17 98 14 86Z"/><path d="M34 43 Q26 8 51 10 Q74 9 69 43" fill="none" stroke="#65433b" stroke-width="5"/>';
return '<svg viewBox="0 0 100 118" xmlns="http://www.w3.org/2000/svg"><g fill="'+color+'" stroke="#78636b" stroke-width="1.5">'+base+'</g>'+(type==='dresses'&&id===0?'<g '+pattern+'><path d="M19 27H80M19 40H80M15 64H85M11 83H89M11 100H89M32 22V104M44 17V105M57 17V105M69 22V104" fill="none"/></g>':'')+(type==='tops'&&id===1?'<path d="M16 45H84M12 57H88M24 70H74" stroke="#d7ad80" stroke-width="8" stroke-dasharray="8 5"/>':'')+'</svg>'}
function modelSvg(s){let dress=products.dresses[s.d][3],top=products.tops[s.t][3],bag=s.b>=0?products.bags[s.b][3]:null;return '<svg viewBox="0 0 470 900" xmlns="http://www.w3.org/2000/svg"><ellipse cx="235" cy="860" rx="115" ry="18" fill="#9d8f9980"/><path d="M200 490 L196 820 214 833 234 515 251 833 273 826 275 490Z" fill="#e4c0aa" stroke="#c59e8b" stroke-width="2"/><path d="M193 812l40 1 2 29q-27 20-51 4z M249 813l34-1 13 29q-28 21-50 1z" fill="#634a43"/><path d="M169 165 Q139 110 165 65 Q193 19 242 33 Q309 28 321 106 L301 318 168 320Z" fill="#4e3632"/><ellipse cx="235" cy="125" rx="59" ry="78" fill="#efc6af" stroke="#c7a08d" stroke-width="2"/><path d="M173 105 Q156 51 197 38 Q273 11 303 69 L285 104 Q271 60 241 62 Q210 94 173 105" fill="#48332f"/><path d="M207 127q10-6 19 0m28 0q9-6 18 0" fill="none" stroke="#5b403d" stroke-width="3"/><path d="M233 155q9 5 17 0m-24 23q13 8 27 0" fill="none" stroke="#a87476" stroke-width="2"/><path d="M211 198l-8 34 65 0-8-34" fill="#e8bcaa"/><path d="M199 225 Q153 238 137 289 L104 461 Q98 482 115 486 Q131 483 135 464 L175 332 L180 512 292 512 299 329 336 464 Q349 488 362 474 L328 280 Q307 231 266 225Z" fill="'+top+'" stroke="#aa8c87" stroke-width="2"/><path d="M180 346 L157 410 134 522 336 522 312 410 291 346Z" fill="'+dress+'" stroke="#795e60" stroke-width="2"/><path d="M158 410L312 410 M143 468L326 468" stroke="#f0cfbd" stroke-width="2" opacity=".5"/><path d="M178 347L142 520 M212 350L206 520 M256 350L267 520 M290 347L323 520" stroke="#ffe3cd" stroke-width="2" opacity=".4"/>'+(bag?'<path d="M330 436Q331 374 362 376Q395 380 390 443" fill="none" stroke="#806258" stroke-width="7"/><path d="M321 427q34-12 77 0l5 88q-46 20-84-4z" fill="'+bag+'" stroke="#634f4c" stroke-width="3"/>':'')+'</svg>'}
function art(p){return garment(p[0].startsWith('T')?'tops':p[0].startsWith('D')?'dresses':'bags',+p[0].slice(1)-1,p[3])}
function showNotice(t){$('notice').textContent=t;$('notice').style.display='block';setTimeout(()=>$('notice').style.display='none',2600)}
function selected(type,i){return (type==='tops'?state.t:type==='dresses'?state.d:state.b)===i}
function render(){let keys=[['tops','上衣 Tops'],['dresses','洋裝 Dresses'],['bags','配件 Accessories']];$('catalog').innerHTML=keys.filter(([k])=>tab==='all'||tab===k).map(([k,title])=>'<div class="section"><h3>'+title+'</h3><div class="grid">'+products[k].map((p,i)=>'<button class="product '+(selected(k,i)?'selected':'')+'" data-kind="'+k+'" data-i="'+i+'"><div class="mini">'+art(p)+'</div><div class="name">'+p[1]+'</div><small>'+money(p[2])+'</small>'+(selected(k,i)?'<span class="tag">WEARING</span>':'')+'</button>').join('')+'</div></div>').join('');document.querySelectorAll('.product').forEach(b=>b.onclick=()=>choose(b.dataset.kind,+b.dataset.i));let wear=[products.tops[state.t],products.dresses[state.d],...(state.b<0?[]:[products.bags[state.b]])];$('looklist').innerHTML=wear.map(p=>'<div class="row"><div class="icon">'+art(p)+'</div><span>'+p[1]+'<br><small>Céleste</small></span><b>'+money(p[2])+'</b></div>').join('');$('total').textContent=money(wear.reduce((sum,p)=>sum+p[2],0));$('scores').innerHTML=[['復古氛圍',94],['層次搭配',88],['整體完成度',state.b<0?85:96]].map(([n,v])=>'<div class="score"><span>'+n+'</span><span class="bar"><i style="width:'+v+'%"></i></span><b>'+v+'%</b></div>').join('');$('thumbs').innerHTML=wear.map(p=>'<div class="thumb">'+art(p)+'</div>').join('');$('complete').innerHTML=[0,1,2].map(i=>'<button data-look="'+i+'" aria-label="整套穿搭 '+(i+1)+'">'+modelSvg({t:i,d:i,b:i})+'</button>').join('');document.querySelectorAll('[data-look]').forEach(b=>b.onclick=()=>change({t:+b.dataset.look,d:+b.dataset.look,b:+b.dataset.look},'full'));}
function choose(k,i){let next={...state};if(k==='tops'){next.t=i;next.b=-1}else if(k==='dresses'){next.d=i;next.b=-1}else{next.b=i}change(next,k==='tops'?'top':k==='dresses'?'skirt':'bag')}
function partRange(p){return {top:[.19,.49],skirt:[.39,.62],bag:[.36,.66],full:[0,1]}[p]}
function revealAt(f){if(!trans)return;let end=trans.a+(trans.b-trans.a)*Math.min(1,f);$('next').style.clipPath='inset('+(trans.a*100)+'% 0 '+((1-end)*100)+'% 0)';$('beam').style.display=f<1?'block':'none';$('beam').style.top=(87+end*896)+'px';if(f>=1){$('current').innerHTML=trans.svg;$('next').style.display='none';trans=null}}
function change(s,part){state=s;uploadLook=null;$('trying').textContent='Trying on · '+(part==='top'?products.tops[s.t][1]:part==='skirt'?products.dresses[s.d][1]:part==='bag'?products.bags[s.b][1]:'Complete look');render();let [a,b]=partRange(part);trans={svg:modelSvg(s),a,b};$('next').innerHTML=trans.svg;$('next').style.display='block';if(!demo){let start=performance.now();function tick(t){if(!trans)return;revealAt(Math.min(1,(t-start)/850));if(trans)requestAnimationFrame(tick)}requestAnimationFrame(tick)}}
function scale(){let z=Math.min(innerWidth/1920,innerHeight/1080);$('app').style.transform='scale('+z+')';$('app').style.left=(innerWidth-1920*z)/2+'px';$('app').style.top=(innerHeight-1080*z)/2+'px'}onresize=scale;scale();document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});$('search').oninput=e=>document.querySelectorAll('.product').forEach(b=>b.style.display=b.textContent.includes(e.target.value.trim())?'':'none');$('shop').onclick=()=>showNotice('購物車尚未串接，這是展示頁面');
$('modelUpload').onchange=e=>{let f=e.target.files[0];if(f){let u=URL.createObjectURL(f);$('portrait').src=u;showNotice('已更新模特兒參考照；衣服合成需匯入實際試穿圖')}};$('lookUpload').onchange=e=>{let f=e.target.files[0];if(f){let u=URL.createObjectURL(f);$('current').innerHTML='<img src="'+u+'" alt="上傳的試穿成果" style="width:100%;height:100%;object-fit:contain">';showNotice('已顯示上傳的完整穿搭照')}};if(demo)document.body.classList.add('demo');
const actions=[{t:0,s:{t:0,d:0,b:-1},p:'full'},{t:2,s:{t:0,d:1,b:-1},p:'skirt'},{t:4,s:{t:1,d:1,b:-1},p:'top'},{t:6,s:{t:1,d:1,b:0},p:'bag'},{t:8,s:{t:1,d:1,b:1},p:'bag'},{t:10,s:{t:2,d:2,b:2},p:'full'},{t:12,s:{t:2,d:2,b:0},p:'bag'},{t:14,s:{t:2,d:2,b:0},p:'shop'}];
window.renderDemoAt=function(t){if(!demo)return;let i=0;for(let k=0;k<actions.length;k++)if(t>=actions[k].t)i=k;let a=actions[i],prior=actions[Math.max(0,i-1)],dt=t-a.t;state={...a.s};$('current').innerHTML=modelSvg(i>0&&dt<.85&&a.p!=='shop'?prior.s:a.s);$('next').style.display='none';$('beam').style.display='none';render();$('trying').textContent='Trying on · '+(a.p==='shop'?'Shop the look':a.p==='full'?'Complete look':a.p==='top'?products.tops[state.t][1]:a.p==='skirt'?products.dresses[state.d][1]:products.bags[state.b][1]);if(i>0&&dt<.85&&a.p!=='shop'){let [lo,hi]=partRange(a.p);trans={svg:modelSvg(state),a:lo,b:hi};$('next').innerHTML=trans.svg;$('next').style.display='block';revealAt(dt/.85)}let target=a.p==='shop'?$('shop'):a.p==='full'?document.querySelector('[data-look="'+state.t+'"]'):document.querySelector('[data-kind="'+(a.p==='top'?'tops':a.p==='skirt'?'dresses':'bags')+'"][data-i="'+(a.p==='top'?state.t:a.p==='skirt'?state.d:state.b)+'"]');if(target){let r=target.getBoundingClientRect(),z=Math.min(innerWidth/1920,innerHeight/1080),fr=$('app').getBoundingClientRect(),x=(r.left-fr.left+r.width/2)/z,y=(r.top-fr.top+r.height/2)/z;$('cursor').style.display='block';$('cursor').style.left=x+'px';$('cursor').style.top=y+'px';$('ripple').style.display=i>0&&dt<.3?'block':'none';$('ripple').style.left=(x-20)+'px';$('ripple').style.top=(y-20)+'px'}};
$('current').innerHTML=modelSvg(state);render();if(demo)renderDemoAt(0);
</script></body></html>
